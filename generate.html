<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetGrow AI - 会展招商增长方案生成器</title>
<style>
:root{--primary:#667eea;--primary-dark:#5a6fd6;--gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:12px;--bg:#f5f7fb;--card:#fff;--text:#1a1a2e;--muted:#8e8ea0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.navbar{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,0.06);position:sticky;top:0;z-index:100}
.navbar-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
.navbar .logo{font-weight:700;font-size:18px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.navbar .nav-links{display:flex;gap:20px;align-items:center}
.navbar .nav-links a{font-size:14px;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;gap:6px}
.btn-primary{background:var(--gradient);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-sm{padding:6px 16px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 20px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:rgba(102,126,234,.1);color:var(--primary)}
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-inner">
<a href="index.html" class="logo">MeetGrow AI</a>
<div class="nav-links">
<a href="app.html">控制台</a>
<a href="#" onclick="logout()">退出</a>
<span id="navUser" style="font-size:13px;color:var(--muted)"></span>
</div></div></nav>
<script>
const _u=JSON.parse(localStorage.getItem('mg_user')||'null');
if(!_u){location.href='login.html'}
document.getElementById('navUser').textContent=_u.name||_u.email;
function logout(){localStorage.removeItem('mg_token');localStorage.removeItem('mg_user');location.href='index.html'}
</script>
<style>
.gen{max-width:900px;margin:0 auto;padding:30px 20px}
.gen h2{font-size:20px;margin-bottom:4px}
.gen .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.input-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
textarea{width:100%;height:120px;border:1.5px solid #e0e0e0;border-radius:8px;padding:12px;font-size:14px;resize:vertical;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--primary)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.progress-card{display:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.progress-step{display:flex;align-items:center;gap:10px;padding:8px 0}
.spinner{width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step-done{color:#52c41a;font-weight:700}
.step-msg{color:#666;font-size:14px}
#result{display:none}
.module{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.module h2{font-size:16px;color:var(--primary);margin-bottom:10px;border-bottom:2px solid #f0f0f0;padding-bottom:8px}
.module .field{margin:6px 0}
.module .field-label{font-weight:600;color:#555;font-size:12px}
.module .field-value{font-size:13px;margin-top:2px}
.module ul{margin:4px 0 4px 16px}
.module li{font-size:13px;margin:3px 0}
.error{color:#e74c3c;background:#fdf0ef;border:1px solid #f5c6cb;border-radius:8px;padding:12px;margin-top:12px;font-size:13px}
.loading-skeleton{text-align:center;padding:40px 20px;color:var(--muted)}
.progress-bar-outer{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin-top:12px;overflow:hidden}
.progress-bar-inner{height:100%;background:var(--gradient);border-radius:4px;transition:width .5s ease;width:0%}
</style>
<div class="gen">
<h2>生成增长方案</h2>
<p class="sub">描述你的活动需求，7 个 AI 智能体协同生成 12 个模块（约需 1-2 分钟）</p>
<div class="input-card">
<textarea id="prompt" placeholder="例如：我要举办一场'2026企业AI落地增长峰会'，目标客户是传统企业老板、制造业老板、AI创业者、投资人和园区负责人。活动规模1000人，目标是招商、卖票、私域沉淀、城市合伙人招募和会后成交。">我要举办一场"2026企业AI落地增长峰会"，目标客户是传统企业老板、制造业老板、AI创业者、投资人和园区负责人。活动规模1000人，目标是招商、卖票、私域沉淀、城市合伙人招募和会后成交。</textarea>
<div class="btn-row">
<button class="btn btn-primary" id="btnGenerate" onclick="generate()">🚀 生成方案</button>
<button class="btn btn-outline" onclick="clearAll()">清空</button>
</div>
</div>
<div class="progress-card" id="progressCard">
<div class="progress-step" id="progressBar"><div class="spinner"></div><span class="step-msg" id="stepMsg">正在准备...</span></div>
<div class="progress-bar-outer"><div class="progress-bar-inner" id="progressFill"></div></div>
</div>
<div id="result"></div>
</div>
<script>
const API_BASE = 'https://meetgrow-ai-djprnpppku.cn-hangzhou.fcapp.run';
const PROGRESS_STEPS = [
  '解析需求...', '生成大会定位...', '生成目标客户画像...', '生成核心卖点...',
  '生成招商合作方案...', '生成赞助权益设计...', '生成嘉宾邀约话术...',
  '生成朋友圈推广文案...', '生成短视频脚本...', '生成社群运营SOP...',
  '生成客户分层策略...', '生成成交转化话术...', '生成执行清单...',
  '整合方案...'
];

async function generate(){
  const p = document.getElementById('prompt').value.trim();
  if(!p){alert('请输入活动需求');return}
  const btn = document.getElementById('btnGenerate');
  const pc = document.getElementById('progressCard');
  const r = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  pc.style.display = 'block';
  r.style.display = 'none';
  r.innerHTML = '';

  // Simulate progress
  let stepIdx = 0;
  const stepMsg = document.getElementById('stepMsg');
  const progressFill = document.getElementById('progressFill');
  stepMsg.textContent = PROGRESS_STEPS[0];
  progressFill.style.width = '0%';

  const progressInterval = setInterval(()=>{
    if(stepIdx < PROGRESS_STEPS.length - 1){
      stepIdx++;
      stepMsg.textContent = PROGRESS_STEPS[stepIdx];
      progressFill.style.width = Math.round((stepIdx / (PROGRESS_STEPS.length - 1)) * 90) + '%';
    }
  }, 8000);

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 600000); // 10 min timeout

    const response = await fetch(API_BASE + '/api/v1/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: p, stream: false}),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    const res = await response.json();

    if(res.success){
      progressFill.style.width = '100%';
      stepMsg.textContent = '生成完成！';
      setTimeout(()=>{
        clearInterval(progressInterval);
        pc.style.display = 'none';
        renderResult(res.data);
      }, 500);
    } else {
      throw new Error(res.error || res.detail || '生成失败');
    }
  } catch(e){
    clearInterval(progressInterval);
    pc.style.display = 'none';
    r.style.display = 'block';
    if(e.name === 'AbortError'){
      r.innerHTML = '<div class="error">生成超时（超过 10 分钟），请缩短需求描述后重试</div>';
    } else {
      r.innerHTML = '<div class="error">' + e.message + '</div>';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 生成方案';
  }
}

function clearAll(){
  document.getElementById('prompt').value = '';
  document.getElementById('result').style.display = 'none';
  document.getElementById('result').innerHTML = '';
  document.getElementById('progressCard').style.display = 'none';
}

function renderResult(state){
  const r = document.getElementById('result');
  r.style.display = 'block';
  let html = '';
  const mods = [
    ['module_1','大会定位'],['module_2','目标客户画像'],['module_3','核心卖点'],
    ['module_4','招商合作方案'],['module_5','赞助权益设计'],['module_6','嘉宾邀约话术'],
    ['module_7','朋友圈推广文案'],['module_8','短视频脚本'],['module_9','社群运营SOP'],
    ['module_10','客户分层跟进策略'],['module_11','会后成交转化话术'],['module_12','执行清单与里程碑']
  ];
  for(const [key,label] of mods){
    const data = state[key];
    if(!data || Object.keys(data).length === 0){
      html += '<div class="module"><h2>'+label+'</h2><p style="color:#999">（待生成）</p></div>';
      continue;
    }
    html += '<div class="module"><h2>'+label+'</h2>';
    for(const [k,v] of Object.entries(data)){
      if(Array.isArray(v)){
        html += '<div class="field"><div class="field-label">'+k+'</div><ul>';
        for(const item of v){
          if(typeof item === 'object'){
            html += '<li>';
            for(const [ik,iv] of Object.entries(item)){
              if(Array.isArray(iv)){
                html += '<b>'+ik+':</b> '+iv.join(', ')+'<br>';
              } else {
                html += '<b>'+ik+':</b> '+iv+'<br>';
              }
            }
            html += '</li>';
          } else {
            html += '<li>'+item+'</li>';
          }
        }
        html += '</ul></div>';
      } else if(typeof v === 'object' && v !== null){
        html += '<div class="field"><div class="field-label">'+k+'</div>';
        for(const [ik,iv] of Object.entries(v)){
          if(Array.isArray(iv)){
            html += '<div style="margin:4px 0 4px 12px"><b>'+ik+':</b> '+iv.join(', ')+'</div>';
          } else {
            html += '<div style="margin:4px 0 4px 12px"><b>'+ik+':</b> '+iv+'</div>';
          }
        }
        html += '</div>';
      } else {
        html += '<div class="field"><div class="field-label">'+k+'</div><div class="field-value">'+v+'</div></div>';
      }
    }
    html += '</div>';
  }
  r.innerHTML = html;
}
</script>
<div class="footer">MeetGrow AI v0.2.0 &mdash; 会展招商增长智能体系统</div>
</body></html>
